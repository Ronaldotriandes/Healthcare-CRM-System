version: '3.9'

networks:
  crm-network:
    driver: bridge

volumes:
  auth_db_data:
  chat_db_data:
  redis_data:

services:

  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTH_DB_USER:-auth_user}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth_password}
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - crm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-auth_user} -d ${AUTH_DB_NAME:-auth_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  chat-db:
    image: postgres:16-alpine
    container_name: chat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CHAT_DB_USER:-chat_user}
      POSTGRES_PASSWORD: ${CHAT_DB_PASSWORD:-chat_password}
      POSTGRES_DB: ${CHAT_DB_NAME:-chat_db}
    volumes:
      - chat_db_data:/var/lib/postgresql/data
    networks:
      - crm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CHAT_DB_USER:-chat_user} -d ${CHAT_DB_NAME:-chat_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Auth Seeder (one-shot: migrate + seed) ──────────────────────────────────
  auth-seeder:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
      target: builder
    container_name: auth-seeder
    restart: "no"
    command: >
      sh -c "npx prisma migrate deploy &&
             npx tsx prisma/seed.ts"
    environment:
      DATABASE_URL: postgresql://${AUTH_DB_USER:-auth_user}:${AUTH_DB_PASSWORD:-auth_password}@auth-db:5432/${AUTH_DB_NAME:-auth_db}?schema=public
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - crm-network

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
      target: production
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://${AUTH_DB_USER:-auth_user}:${AUTH_DB_PASSWORD:-auth_password}@auth-db:5432/${AUTH_DB_NAME:-auth_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-seeder:
        condition: service_completed_successfully
    networks:
      - crm-network
    volumes:
      - ./auth-service/uploads:/app/uploads

  chat-service:
    build:
      context: ./chat-service
      dockerfile: Dockerfile
      target: production
    container_name: chat-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgresql://${CHAT_DB_USER:-chat_user}:${CHAT_DB_PASSWORD:-chat_password}@chat-db:5432/${CHAT_DB_NAME:-chat_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      AUTH_SERVICE_URL: http://auth-service:3001
      PORT: 3002
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      chat-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - crm-network
    volumes:
      - ./chat-service/uploads:/app/uploads

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
      target: production
    container_name: gateway-service
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      AUTH_SERVICE_URL: http://auth-service:3001
      CHAT_SERVICE_URL: http://chat-service:3002
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      - auth-service
      - chat-service
    networks:
      - crm-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_GRAPHQL_URL: ${NEXT_PUBLIC_GRAPHQL_URL:-http://localhost:4000/graphql}
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL:-http://localhost:3001}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:3002}
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      - gateway-service
      - auth-service
    networks:
      - crm-network
